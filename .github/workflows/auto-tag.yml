name: Auto Tag

# 触发条件：当代码 push 到 main 分支时
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'local/**'
      - '.github/**'
      - 'source/**'

jobs:
  tag:
    runs-on: ubuntu-latest
    # Default: NO tag. Only tag when commit message contains #patch, #minor, or #major.
    if: >-
      contains(github.event.head_commit.message, '#patch') ||
      contains(github.event.head_commit.message, '#minor') ||
      contains(github.event.head_commit.message, '#major')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify source version and push annotated tag
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          markers=()
          [[ "${COMMIT_MESSAGE}" == *'#patch'* ]] && markers+=(patch)
          [[ "${COMMIT_MESSAGE}" == *'#minor'* ]] && markers+=(minor)
          [[ "${COMMIT_MESSAGE}" == *'#major'* ]] && markers+=(major)
          if [[ "${#markers[@]}" -ne 1 ]]; then
            echo 'Exactly one version bump marker is required.' >&2
            exit 1
          fi
          bump="${markers[0]}"
          node scripts/verify-release-version.js auto-tag --bump "${bump}"
          release_version="$(tr -d '\r\n[:space:]' < VERSION)"
          release_tag="v${release_version}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${release_tag}" -m "Release ${release_tag}" "${GITHUB_SHA}"
          git push origin "refs/tags/${release_tag}"
