name: Desktop Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag in semver format, e.g. v3.29.1'
        required: true
        type: string
      release_commit:
        description: 'Full 40-character product commit SHA reachable from main'
        required: true
        type: string
      release_message:
        description: 'Single-line annotated tag message'
        required: true
        type: string

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_commit: ${{ steps.resolve.outputs.release_commit }}
      release_message: ${{ steps.resolve.outputs.release_message }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate fixed release target and remote state
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_RELEASE_COMMIT: ${{ inputs.release_commit }}
          INPUT_RELEASE_MESSAGE: ${{ inputs.release_message }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${INPUT_RELEASE_TAG}"
            release_commit="${INPUT_RELEASE_COMMIT}"
            release_message="${INPUT_RELEASE_MESSAGE}"
          else
            release_tag="${GITHUB_REF_NAME}"
            remote_tag_lines="$(
              git ls-remote --tags origin \
                "refs/tags/${release_tag}" \
                "refs/tags/${release_tag}^{}"
            )"
            tag_object="$(
              awk -v ref="refs/tags/${release_tag}" '$2 == ref { print $1 }' \
                <<<"${remote_tag_lines}"
            )"
            release_commit="$(
              awk -v ref="refs/tags/${release_tag}^{}" '$2 == ref { print $1 }' \
                <<<"${remote_tag_lines}"
            )"
            if [[ -z "${tag_object}" || -z "${release_commit}" ]]; then
              echo "::error::Release push must use an annotated tag; lightweight tags are rejected."
              exit 1
            fi
            git fetch origin "refs/tags/${release_tag}:refs/tags/${release_tag}"
            release_message="$(
              git for-each-ref --format='%(contents:subject)' \
                "refs/tags/${release_tag}"
            )"
          fi

          if [[ ! "${release_tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must be a stable vX.Y.Z SemVer without leading zeros."
            exit 1
          fi
          if [[ ! "${release_commit}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Release commit must be a full 40-character SHA."
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] &&
             [[ -z "${release_message}" || "${release_message}" == *$'\n'* || "${release_message}" == *$'\r'* ]]; then
            echo "::error::Annotated tag message must be a non-empty single line."
            exit 1
          fi

          release_commit="${release_commit,,}"
          release_object_type="$(git cat-file -t "${release_commit}" 2>/dev/null || true)"
          if [[ "${release_object_type}" != "commit" ]]; then
            echo "::error::Release commit must identify a commit object directly."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${release_commit}" origin/main; then
            echo "::error::Release commit is not reachable from origin/main."
            exit 1
          fi

          remote_tag_lines="$(
            git ls-remote --tags origin \
              "refs/tags/${release_tag}" \
              "refs/tags/${release_tag}^{}"
          )"
          tag_object="$(
            awk -v ref="refs/tags/${release_tag}" '$2 == ref { print $1 }' \
              <<<"${remote_tag_lines}"
          )"
          peeled_commit="$(
            awk -v ref="refs/tags/${release_tag}^{}" '$2 == ref { print $1 }' \
              <<<"${remote_tag_lines}"
          )"
          if [[ -n "${tag_object}" && -z "${peeled_commit}" ]]; then
            echo "::error::Existing lightweight tag is not recoverable."
            exit 1
          fi
          if [[ -n "${peeled_commit}" && "${peeled_commit}" != "${release_commit}" ]]; then
            echo "::error::Existing annotated tag points to a different commit."
            exit 1
          fi
          if [[ -n "${tag_object}" ]]; then
            git fetch --no-tags origin \
              "refs/tags/${release_tag}:refs/work10/preflight-release-tag"
            remote_object_type="$(git cat-file -t refs/work10/preflight-release-tag)"
            remote_tag_header="$(git cat-file -p refs/work10/preflight-release-tag)"
            remote_target_object="$(
              awk '$1 == "object" { print $2; exit }' <<<"${remote_tag_header}"
            )"
            remote_target_type="$(
              awk '$1 == "type" { print $2; exit }' <<<"${remote_tag_header}"
            )"
            remote_tag_name="$(
              awk '$1 == "tag" { print $2; exit }' <<<"${remote_tag_header}"
            )"
            if [[ "${remote_object_type}" != "tag" ||
                  "${remote_target_object}" != "${release_commit}" ||
                  "${remote_target_type}" != "commit" ||
                  "${remote_tag_name}" != "${release_tag}" ]]; then
              echo "::error::Existing annotated tag does not directly identify the requested commit and tag name."
              exit 1
            fi
          fi

          release_probe="$(mktemp)"
          set +e
          gh api --include \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" \
            >"${release_probe}" 2>&1
          release_probe_exit=$?
          set -e
          if [[ ${release_probe_exit} -eq 0 ]]; then
            rm -f "${release_probe}"
            echo "::error::A GitHub Release already exists for ${release_tag}."
            exit 1
          fi
          release_http_status="$(
            awk '/^HTTP\// { status=$2 } END { print status }' "${release_probe}"
          )"
          rm -f "${release_probe}"
          if [[ "${release_http_status}" != "404" ]]; then
            echo "::error::Unable to confirm Release state for ${release_tag}."
            exit 1
          fi

          printf 'release_tag=%s\n' "${release_tag}" >>"${GITHUB_OUTPUT}"
          printf 'release_commit=%s\n' "${release_commit}" >>"${GITHUB_OUTPUT}"
          printf 'release_message=%s\n' "${release_message}" >>"${GITHUB_OUTPUT}"

  build-windows:
    needs: preflight
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.preflight.outputs.release_commit }}
      DSA_RELEASE_COMMIT_SHA: ${{ needs.preflight.outputs.release_commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify fixed release checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${RELEASE_COMMIT}" ]]
          echo "DSA_WEB_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "DSA_WEB_REVISION=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            apps/dsa-web/package-lock.json
            apps/dsa-desktop/package-lock.json

      - name: Verify checked-in release version
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-release-version.js release --tag "${RELEASE_TAG}"

      - name: Build desktop package (Windows)
        shell: pwsh
        env:
          DSA_SKIP_DEVMODE_CHECK: 'true'
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build-all.ps1

      - name: Validate Windows installer verifier contracts
        shell: pwsh
        run: |
          $diagnosticRoot = Join-Path $env:RUNNER_TEMP "pp02-installer-diagnostics-$env:DSA_RELEASE_COMMIT_SHA-$env:GITHUB_RUN_ID"
          powershell -ExecutionPolicy Bypass -File scripts/tests/verify-windows-installer-contract.ps1 `
            -ArtifactDiagnosticRoot $diagnosticRoot

      - name: Scan Windows release assets with Microsoft Defender
        shell: pwsh
        run: |
          $expectedVersion = $env:RELEASE_TAG.TrimStart('v')
          $installer = "apps/dsa-desktop/dist/pp02-ai-daily-stock-analysis-windows-installer-$env:RELEASE_TAG.exe"
          $blockmap = "$installer.blockmap"
          $latest = 'apps/dsa-desktop/dist/latest.yml'
          $defenderRoot = Join-Path $env:RUNNER_TEMP "pp02-defender-reports-$env:DSA_RELEASE_COMMIT_SHA-$env:GITHUB_RUN_ID"
          $preinstallDefenderReport = Join-Path $defenderRoot 'preinstall.json'
          New-Item -ItemType Directory -Path $defenderRoot -Force | Out-Null
          node scripts/windows-defender-scan.js `
            --head $env:DSA_RELEASE_COMMIT_SHA `
            --report $preinstallDefenderReport `
            --path $installer `
            --path $blockmap `
            --path $latest `
            --path apps/dsa-desktop/dist/win-unpacked
          if ($LASTEXITCODE -ne 0) {
            throw 'Microsoft Defender rejected the Windows release build.'
          }

      - name: Validate installed Windows lifecycle
        shell: pwsh
        run: |
          $expectedVersion = $env:RELEASE_TAG.TrimStart('v')
          $installerPath = "apps/dsa-desktop/dist/pp02-ai-daily-stock-analysis-windows-installer-$env:RELEASE_TAG.exe"
          $installer = Get-Item -LiteralPath $installerPath -ErrorAction Stop
          $installRoot = Join-Path $env:RUNNER_TEMP "pp02-installer-verify-$env:DSA_RELEASE_COMMIT_SHA"
          $diagnosticRoot = Join-Path $env:RUNNER_TEMP "pp02-installer-diagnostics-$env:DSA_RELEASE_COMMIT_SHA-$env:GITHUB_RUN_ID"
          $defenderRoot = Join-Path $env:RUNNER_TEMP "pp02-defender-reports-$env:DSA_RELEASE_COMMIT_SHA-$env:GITHUB_RUN_ID"
          $preinstallDefenderReport = Join-Path $defenderRoot 'preinstall.json'
          $installedDefenderReport = Join-Path $defenderRoot 'installed.json'
          powershell -ExecutionPolicy Bypass -File scripts/verify-windows-installer.ps1 `
            -InstallerPath $installer.FullName `
            -ExpectedVersion $expectedVersion `
            -InstallRoot $installRoot `
            -DiagnosticRoot $diagnosticRoot `
            -ExpectedCommitSha $env:DSA_RELEASE_COMMIT_SHA `
            -MalwareScannerPath scripts/windows-defender-scan.js `
            -MalwareReportPath $installedDefenderReport `
            -PreinstallMalwareReportPath $preinstallDefenderReport

      - name: Upload Windows installer diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pp02-windows-installer-diagnostics-${{ env.DSA_RELEASE_COMMIT_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pp02-installer-diagnostics-${{ env.DSA_RELEASE_COMMIT_SHA }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release artifact (Windows)
        shell: pwsh
        run: |
          $expectedInstallerName = "pp02-ai-daily-stock-analysis-windows-installer-$env:RELEASE_TAG.exe"
          $installerPath = Join-Path 'apps/dsa-desktop/dist' $expectedInstallerName
          $installerExe = Get-Item -Path $installerPath -ErrorAction SilentlyContinue
          if (-not $installerExe) {
            throw "No expected NSIS installer found under apps/dsa-desktop/dist: $expectedInstallerName"
          }
          $winUnpacked = 'apps/dsa-desktop/dist/win-unpacked'
          if (-not (Test-Path $winUnpacked)) {
            throw 'No win-unpacked directory found under apps/dsa-desktop/dist.'
          }
          New-Item -ItemType Directory -Path 'dist/release-assets' -Force | Out-Null
          $exeTarget = "dist/release-assets/$expectedInstallerName"
          $stage = 'dist/portable-stage'
          $zipTarget = "dist/release-assets/pp02-ai-daily-stock-analysis-windows-noinstall-$env:RELEASE_TAG.zip"
          Copy-Item -Path $installerExe.FullName -Destination $exeTarget -Force
          node scripts/prepare-portable-release.js stage $env:RELEASE_TAG $winUnpacked $stage
          Compress-Archive -Path "$stage/*" -DestinationPath $zipTarget -CompressionLevel Optimal -Force
          node scripts/prepare-portable-release.js verify $env:RELEASE_TAG $zipTarget "$zipTarget.sha256"
          $releaseFinalExtract = Join-Path $env:RUNNER_TEMP "pp02-portable-release-final-$env:DSA_RELEASE_COMMIT_SHA"
          $directorySeparators = [char[]]@(
            [IO.Path]::DirectorySeparatorChar,
            [IO.Path]::AltDirectorySeparatorChar
          )
          $normalizedRunnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd(
            $directorySeparators
          )
          $normalizedReleaseFinalExtract = [IO.Path]::GetFullPath($releaseFinalExtract)
          $runnerPrefix = $normalizedRunnerTemp + [IO.Path]::DirectorySeparatorChar
          if (-not $normalizedReleaseFinalExtract.StartsWith(
              $runnerPrefix,
              [StringComparison]::OrdinalIgnoreCase
            ) -or
              -not (Split-Path -Leaf $normalizedReleaseFinalExtract).StartsWith(
                'pp02-portable-release-final-',
                [StringComparison]::OrdinalIgnoreCase
              )) {
            throw 'Release final ZIP extraction path is outside the owned runner root.'
          }
          function Remove-OwnedReleaseDirectoryWithRetry {
            param([Parameter(Mandatory=$true)][string]$OwnedRoot)

            if (-not (Test-Path -LiteralPath $OwnedRoot)) {
              return
            }
            for ($attempt = 1; $attempt -le 15; $attempt++) {
              try {
                Remove-Item -LiteralPath $OwnedRoot -Recurse -Force -ErrorAction Stop
                if (-not (Test-Path -LiteralPath $OwnedRoot)) {
                  return
                }
              }
              catch {
                if ($attempt -eq 15) {
                  throw "Failed to remove release-owned extraction directory after $attempt attempts."
                }
              }
              Start-Sleep -Seconds 1
            }
            throw 'Failed to remove release-owned extraction directory.'
          }
          try {
            if (Test-Path -LiteralPath $releaseFinalExtract) {
              Remove-OwnedReleaseDirectoryWithRetry -OwnedRoot $releaseFinalExtract
            }
            Expand-Archive -LiteralPath $zipTarget -DestinationPath $releaseFinalExtract
            $releaseVersion = $env:RELEASE_TAG.TrimStart('v')
            $requiredBrowserRelativePath = 'resources/backend/stock_analysis/_internal/fake_useragent/data/browsers.jsonl'
            $releaseFinalManifestPath = Join-Path $releaseFinalExtract 'pp02-portable-release.json'
            $releaseFinalManifest = Get-Content -LiteralPath $releaseFinalManifestPath -Raw | ConvertFrom-Json
            $managedBrowserEntries = @(
              $releaseFinalManifest.managedFiles |
                Where-Object { $_.relativePath -eq $requiredBrowserRelativePath }
            )
            if ($managedBrowserEntries.Count -ne 1) {
              throw "Final Release portable manifest does not manage exactly one $requiredBrowserRelativePath entry."
            }
            $releaseBrowserData = Join-Path $releaseFinalExtract $requiredBrowserRelativePath
            if (-not (Test-Path -LiteralPath $releaseBrowserData -PathType Leaf)) {
              throw "Final Release portable ZIP is missing $requiredBrowserRelativePath."
            }
            node scripts/verify-windows-runtime-integrity.js $releaseFinalExtract $releaseVersion
            if ($LASTEXITCODE -ne 0) {
              throw "Final Release portable ZIP runtime integrity verification failed with exit code $LASTEXITCODE."
            }
            $releaseFinalPackagedEntry = Join-Path $releaseFinalExtract 'resources/backend/stock_analysis/stock_analysis.exe'
            powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/verify-frozen-backend.ps1 -PackagedEntry $releaseFinalPackagedEntry
          }
          finally {
            if (Test-Path -LiteralPath $releaseFinalExtract) {
              Remove-OwnedReleaseDirectoryWithRetry -OwnedRoot $releaseFinalExtract
            }
          }
          Get-ChildItem -Path 'apps/dsa-desktop/dist' -File |
            Where-Object { $_.Name -eq 'latest.yml' -or $_.Name -like '*.blockmap' } |
            ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "dist/release-assets/$($_.Name)" -Force
            }
          if (-not (Test-Path 'dist/release-assets/latest.yml')) {
            throw 'No latest.yml found under dist/release-assets.'
          }
          $expectedVersion = $env:RELEASE_TAG.TrimStart('v')
          $versionPattern = '^version:\s*[''"]?' + [regex]::Escape($expectedVersion) + '[''"]?\s*$'
          if (-not (Select-String -Path 'dist/release-assets/latest.yml' -Pattern $versionPattern)) {
            throw "latest.yml version does not match release tag $env:RELEASE_TAG."
          }
          $latestText = Get-Content -Path 'dist/release-assets/latest.yml' -Raw
          $pathMatch = [regex]::Match($latestText, '(?m)^\s*path:\s*[''"]?([^''"\r\n]+)[''"]?\s*$')
          if (-not $pathMatch.Success) {
            throw 'latest.yml missing path field.'
          }
          $latestInstallerPath = $pathMatch.Groups[1].Value.Trim()
          if ($latestInstallerPath -ne $expectedInstallerName) {
            throw "latest.yml path ($latestInstallerPath) does not match release installer $expectedInstallerName."
          }
          $urlMatch = [regex]::Match($latestText, '(?m)^\s*-\s*url:\s*[''"]?([^''"\r\n]+)[''"]?\s*$')
          if ($urlMatch.Success -and $urlMatch.Groups[1].Value.Trim() -ne $expectedInstallerName) {
            throw "latest.yml file url ($($urlMatch.Groups[1].Value.Trim())) does not match release installer $expectedInstallerName."
          }
          $expectedBlockmapName = "$expectedInstallerName.blockmap"
          if (-not (Get-ChildItem -Path 'dist/release-assets' -Filter $expectedBlockmapName -File)) {
            throw "No matching blockmap found under dist/release-assets: $expectedBlockmapName"
          }
          Get-ChildItem -Path 'dist/release-assets' -File | Sort-Object Name | Format-Table Name, Length

      - name: Scan final Windows release assets with Microsoft Defender
        shell: pwsh
        run: |
          $defenderRoot = Join-Path $env:RUNNER_TEMP "pp02-defender-reports-$env:DSA_RELEASE_COMMIT_SHA-$env:GITHUB_RUN_ID"
          $installerTarget = "dist/release-assets/pp02-ai-daily-stock-analysis-windows-installer-$env:RELEASE_TAG.exe"
          $blockmapTarget = "$installerTarget.blockmap"
          $latestTarget = 'dist/release-assets/latest.yml'
          $zipTarget = "dist/release-assets/pp02-ai-daily-stock-analysis-windows-noinstall-$env:RELEASE_TAG.zip"
          $checksumTarget = "$zipTarget.sha256"
          $defenderExtract = Join-Path $env:RUNNER_TEMP "pp02-defender-release-extract-$env:DSA_RELEASE_COMMIT_SHA-$env:GITHUB_RUN_ID"
          if (Test-Path -LiteralPath $defenderExtract) {
            Remove-Item -LiteralPath $defenderExtract -Recurse -Force
          }
          try {
            Expand-Archive -LiteralPath $zipTarget -DestinationPath $defenderExtract
            node scripts/windows-defender-scan.js `
              --head $env:DSA_RELEASE_COMMIT_SHA `
              --report (Join-Path $defenderRoot 'final-release.json') `
              --path $installerTarget `
              --path $blockmapTarget `
              --path $latestTarget `
              --path $zipTarget `
              --path $checksumTarget `
              --path $defenderExtract
            if ($LASTEXITCODE -ne 0) {
              throw 'Microsoft Defender rejected the final Windows release assets.'
            }
          }
          finally {
            if (Test-Path -LiteralPath $defenderExtract) {
              Remove-Item -LiteralPath $defenderExtract -Recurse -Force
            }
          }

      - name: Upload Windows Defender reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pp02-windows-defender-reports-${{ env.DSA_RELEASE_COMMIT_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pp02-defender-reports-${{ env.DSA_RELEASE_COMMIT_SHA }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v6
        with:
          name: desktop-windows-${{ env.RELEASE_TAG }}
          path: dist/release-assets/*
          if-no-files-found: error

  build-macos:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.preflight.outputs.release_commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify fixed release checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${RELEASE_COMMIT}" ]]
          echo "DSA_WEB_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "DSA_WEB_REVISION=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            apps/dsa-web/package-lock.json
            apps/dsa-desktop/package-lock.json

      - name: Verify checked-in release version
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-release-version.js release --tag "${RELEASE_TAG}"

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/electron
          key: electron-macos-${{ matrix.arch }}-${{ hashFiles('apps/dsa-desktop/package-lock.json') }}
          restore-keys: |
            electron-macos-${{ matrix.arch }}-

      - name: Disable Spotlight indexing (prevents hdiutil Resource busy)
        run: sudo mdutil -a -i off

      - name: Build desktop package (macOS)
        env:
          DSA_MAC_ARCH: ${{ matrix.arch }}
        run: bash scripts/build-all-macos.sh

      - name: Prepare release artifact (macOS)
        shell: bash
        run: |
          set -euo pipefail
          dmg_file="$(ls -t apps/dsa-desktop/dist/*${{ matrix.arch }}*.dmg 2>/dev/null | head -n 1 || true)"
          if [[ -z "${dmg_file}" ]]; then
            dmg_file="$(ls -t apps/dsa-desktop/dist/*.dmg | head -n 1)"
          fi
          test -n "$dmg_file"
          mkdir -p dist/release-assets
          cp "$dmg_file" "dist/release-assets/pp02-ai-daily-stock-analysis-macos-${{ matrix.arch }}-${RELEASE_TAG}.dmg"

      - uses: actions/upload-artifact@v6
        with:
          name: desktop-macos-${{ matrix.arch }}-${{ env.RELEASE_TAG }}
          path: dist/release-assets/*.dmg
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs: [preflight, build-windows, build-macos]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.preflight.outputs.release_commit }}
      RELEASE_MESSAGE: ${{ needs.preflight.outputs.release_message }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.release_commit }}
          fetch-depth: 0

      - name: Revalidate and ensure annotated release tag
        shell: bash
        run: |
          set -euo pipefail

          [[ "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "${RELEASE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${RELEASE_COMMIT}" ]]

          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${RELEASE_COMMIT}" origin/main; then
            echo "::error::Release commit is no longer reachable from origin/main."
            exit 1
          fi

          release_probe="$(mktemp)"
          set +e
          gh api --include \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            >"${release_probe}" 2>&1
          release_probe_exit=$?
          set -e
          if [[ ${release_probe_exit} -eq 0 ]]; then
            rm -f "${release_probe}"
            echo "::error::A GitHub Release already exists for ${RELEASE_TAG}."
            exit 1
          fi
          release_http_status="$(
            awk '/^HTTP\// { status=$2 } END { print status }' "${release_probe}"
          )"
          rm -f "${release_probe}"
          if [[ "${release_http_status}" != "404" ]]; then
            echo "::error::Unable to confirm Release state for ${RELEASE_TAG}."
            exit 1
          fi

          remote_tag_lines="$(
            git ls-remote --tags origin \
              "refs/tags/${RELEASE_TAG}" \
              "refs/tags/${RELEASE_TAG}^{}"
          )"
          tag_object="$(
            awk -v ref="refs/tags/${RELEASE_TAG}" '$2 == ref { print $1 }' \
              <<<"${remote_tag_lines}"
          )"
          peeled_commit="$(
            awk -v ref="refs/tags/${RELEASE_TAG}^{}" '$2 == ref { print $1 }' \
              <<<"${remote_tag_lines}"
          )"

          if [[ -n "${tag_object}" && -z "${peeled_commit}" ]]; then
            echo "::error::Existing lightweight tag is not recoverable."
            exit 1
          fi
          if [[ -n "${peeled_commit}" && "${peeled_commit}" != "${RELEASE_COMMIT}" ]]; then
            echo "::error::Existing annotated tag points to a different commit."
            exit 1
          fi
          if [[ -n "${tag_object}" ]]; then
            git fetch --no-tags origin \
              "refs/tags/${RELEASE_TAG}:refs/work10/publish-release-tag"
            remote_object_type="$(git cat-file -t refs/work10/publish-release-tag)"
            remote_tag_header="$(git cat-file -p refs/work10/publish-release-tag)"
            remote_target_object="$(
              awk '$1 == "object" { print $2; exit }' <<<"${remote_tag_header}"
            )"
            remote_target_type="$(
              awk '$1 == "type" { print $2; exit }' <<<"${remote_tag_header}"
            )"
            remote_tag_name="$(
              awk '$1 == "tag" { print $2; exit }' <<<"${remote_tag_header}"
            )"
            if [[ "${remote_object_type}" != "tag" ||
                  "${remote_target_object}" != "${RELEASE_COMMIT}" ||
                  "${remote_target_type}" != "commit" ||
                  "${remote_tag_name}" != "${RELEASE_TAG}" ]]; then
              echo "::error::Existing annotated tag does not directly identify the requested commit and tag name."
              exit 1
            fi
          fi

          if [[ -z "${tag_object}" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "${RELEASE_TAG}" "${RELEASE_COMMIT}" -m "${RELEASE_MESSAGE}"
            [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" == "tag" ]]
            [[ "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" == "${RELEASE_COMMIT}" ]]
            git push origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          fi

          verified_tag_lines="$(
            git ls-remote --tags origin \
              "refs/tags/${RELEASE_TAG}" \
              "refs/tags/${RELEASE_TAG}^{}"
          )"
          verified_object="$(
            awk -v ref="refs/tags/${RELEASE_TAG}" '$2 == ref { print $1 }' \
              <<<"${verified_tag_lines}"
          )"
          verified_commit="$(
            awk -v ref="refs/tags/${RELEASE_TAG}^{}" '$2 == ref { print $1 }' \
              <<<"${verified_tag_lines}"
          )"
          if [[ -z "${verified_object}" || "${verified_commit}" != "${RELEASE_COMMIT}" ]]; then
            echo "::error::Remote annotated tag verification failed."
            exit 1
          fi
          git fetch --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/work10/verified-release-tag"
          verified_object_type="$(git cat-file -t refs/work10/verified-release-tag)"
          verified_tag_header="$(git cat-file -p refs/work10/verified-release-tag)"
          verified_target_object="$(
            awk '$1 == "object" { print $2; exit }' <<<"${verified_tag_header}"
          )"
          verified_target_type="$(
            awk '$1 == "type" { print $2; exit }' <<<"${verified_tag_header}"
          )"
          verified_tag_name="$(
            awk '$1 == "tag" { print $2; exit }' <<<"${verified_tag_header}"
          )"
          if [[ "${verified_object_type}" != "tag" ||
                "${verified_target_object}" != "${RELEASE_COMMIT}" ||
                "${verified_target_type}" != "commit" ||
                "${verified_tag_name}" != "${RELEASE_TAG}" ]]; then
            echo "::error::Remote annotated tag object failed direct-target verification."
            exit 1
          fi

      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: dist/release-assets
          merge-multiple: true

      - name: Show release assets
        run: ls -lah dist/release-assets

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --title "${RELEASE_TAG}" \
            --notes "PP02 AI Daily Stock Analysis ${RELEASE_TAG}. Based on ZhuLinsen/daily_stock_analysis v3.28.0 and independently modified; not an upstream official release." \
            dist/release-assets/*
